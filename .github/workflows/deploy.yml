name: Build und Auslieferung

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Image bauen und ausliefern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bei der GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      # Läuft erst, wenn die App bei Bunny angelegt ist und APP_ID + BUNNYNET_API_KEY hinterlegt sind.
      - name: Neue Version bei Bunny Magic Containers ausrollen
        if: ${{ vars.APP_ID != '' }}
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: app
          image_tag: "${{ github.sha }}"
